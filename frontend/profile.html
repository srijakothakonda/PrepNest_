<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · PrepNest</title><link rel="stylesheet" href="css/style.css"></head><body><script src="js/api.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{document.body.innerHTML=layout('profile',`<div class="title-row"><div><h1 class="page-title">Your profile</h1><p class="subtle">The account behind your preparation workspace.</p></div></div><section class="card" style="max-width:560px" id="profile"></section>`);const u=await hydrateUser();document.querySelector('#profile').innerHTML=`<div class="avatar" style="width:55px;height:55px;font-size:23px">${u.name[0]}</div><h2>${u.name}</h2><p class="subtle">${u.email}</p><p style="margin-top:22px">Your PrepNest is private and only visible to you.</p>`})</script></body></html>
